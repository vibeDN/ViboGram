name: trial-build

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 340
    permissions:
      contents: write
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Disk usage before cleanup
        run: df -h /

      - name: Free disk space (remove unused Xcode versions, simulators, junk)
        run: |
          set -x
          sudo rm -rf /Applications/Xcode_16*.app /Applications/Xcode_17*.app 2>/dev/null || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches
          sudo rm -rf ~/Library/Developer/Xcode/DerivedData
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/*.simruntime 2>/dev/null || true
          df -h /

      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app || \
          sudo xcode-select -s /Applications/Xcode.app
          # MARK: ViboGram - toolchain diagnostics. Cheap, harmless, printed so a
          # real Xcode/Bazel/swiftc version-mismatch theory can be confirmed or
          # ruled out with hard evidence instead of assumption, if the
          # SwiftSignalKitFramework copy race resurfaces.
          echo "=== Toolchain diagnostics ==="
          xcode-select -p
          xcodebuild -version
          xcrun --find swift
          xcrun swift --version
          bazel --version || true

      - name: Write minimal development configuration
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          python3 - <<'EOF'
          import json, os
          path = "build-system/template_minimal_development_configuration.json"
          with open(path) as f:
              cfg = json.load(f)
          cfg["bundle_id"] = os.environ["IOS_BUNDLE_ID"]
          cfg["api_id"] = os.environ["TG_API_ID"]
          cfg["api_hash"] = os.environ["TG_API_HASH"]
          cfg["team_id"] = os.environ["IOS_TEAM_ID"]
          with open("build-system/generated_trial_configuration.json", "w") as f:
              json.dump(cfg, f, indent=2)
          print(json.dumps(cfg, indent=2))
          EOF

      - name: Decode signing certificate and provisioning profile
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          CODESIGNING_DIR="$RUNNER_TEMP/codesigning"
          mkdir -p "$CODESIGNING_DIR/certs" "$CODESIGNING_DIR/profiles"
          echo -n "$IOS_CERT_P12_BASE64" | base64 --decode -o "$CODESIGNING_DIR/certs/cert.p12"
          echo -n "$IOS_PROFILE_BASE64" | base64 --decode -o "$CODESIGNING_DIR/profiles/profile.mobileprovision"
          echo "CODESIGNING_DIR=$CODESIGNING_DIR" >> "$GITHUB_ENV"

          # codesign (invoked by Bazel's rules_apple, not xcodebuild) needs the
          # profile's matching identity in a keychain -- it isn't read from the
          # .p12 file directly. Import it into a job-local keychain.
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CODESIGNING_DIR/certs/cert.p12" -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          # Xcode/xcodebuild profile matching also expects profiles here.
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$CODESIGNING_DIR/profiles/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Generate Xcode project via Bazel
        run: |
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            generateProject \
            --configurationPath=build-system/generated_trial_configuration.json \
            --codesigningInformationPath="$CODESIGNING_DIR" \
            --disableExtensions

      - name: Disk usage after project generation
        run: df -h /

      - name: Locate generated .xcodeproj
        id: proj
        run: |
          set -euo pipefail
          PROJ_PATH=$(find . -maxdepth 3 -iname "*.xcodeproj" -not -path "*/bazel-*" | head -1)
          if [ -z "$PROJ_PATH" ]; then
            echo "No .xcodeproj found after generateProject" >&2
            find . -maxdepth 3 -iname "*.xcodeproj" -o -iname "*.xcworkspace"
            exit 1
          fi
          echo "Found project: $PROJ_PATH"
          echo "path=$PROJ_PATH" >> "$GITHUB_OUTPUT"

      - name: List available schemes
        id: scheme
        run: |
          set -o pipefail
          xcodebuild -list -project "${{ steps.proj.outputs.path }}" | tee scheme_list.txt
          # rules_xcodeproj auto-generates a scheme per Bazel target (hundreds of
          # them) -- picking the first line under "Schemes:" grabs some internal
          # helper (e.g. _LocalDebugOptions), not the actual app. The real app
          # scheme is named after the product ("Swiftgram"); match it exactly.
          SCHEME=$(awk '/Schemes:/{flag=1; next} flag && $1=="Swiftgram"{print $1; exit}' scheme_list.txt)
          if [ -z "$SCHEME" ]; then
            echo "Could not find a 'Swiftgram' scheme. Full scheme list:" >&2
            cat scheme_list.txt >&2
            exit 1
          fi
          echo "Using scheme: $SCHEME"
          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"

      # MARK: ViboGram - action-tmate hung indefinitely here (deprecated/dead
      # relay), replaced with our own sshd + ngrok tcp tunnel. The public
      # ngrok address still has to be copied out of the live GH Actions log by
      # hand (GitHub's job-logs API only returns logs for a COMPLETED job, so
      # this session can't read it live) -- print it clearly and sleep so
      # there's a real window to connect.
      - name: Enable SSH and expose via ngrok (live debug for SwiftSignalKitFramework race)
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          set -euo pipefail
          # MARK: ViboGram - password auth via `dscl . -passwd` failed here
          # ("Permission denied ... eDSAuthFailed") -- the GH Actions runner
          # image apparently restricts Directory Services password changes even
          # under sudo. SSH key auth sidesteps that entirely (just an
          # authorized_keys file write) and also avoids relaying a password
          # through chat at all -- the public key below is a fixed, throwaway
          # keypair generated once for this debugging session, not a secret.
          sudo systemsetup -setremotelogin on
          sudo launchctl kickstart -k system/com.openssh.sshd || true
          mkdir -p ~/.ssh
          echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEDiHA9Oa24au4lm62k3Lyg29pVbCNZA2GoZCD46rKK3 ci-debug" >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/authorized_keys
          brew install ngrok >/tmp/ngrok_install.log 2>&1 || cat /tmp/ngrok_install.log
          ngrok config add-authtoken "$NGROK_AUTHTOKEN"
          ngrok tcp 22 --log=stdout > /tmp/ngrok.log 2>&1 &
          TUNNEL_URL=""
          for i in $(seq 1 15); do
            sleep 2
            TUNNEL_URL=$(curl -s http://127.0.0.1:4040/api/tunnels | python3 -c "import json,sys
try:
    print(json.load(sys.stdin)['tunnels'][0]['public_url'])
except Exception:
    pass" 2>/dev/null || true)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
          done
          if [ -z "$TUNNEL_URL" ]; then
            echo "ngrok tunnel never came up after 30s. ngrok log:" >&2
            cat /tmp/ngrok.log >&2
            exit 1
          fi
          HOST_PORT="${TUNNEL_URL#tcp://}"
          NGROK_HOST="${HOST_PORT%:*}"
          NGROK_PORT="${HOST_PORT##*:}"
          echo "############################################"
          echo "SSH CONNECT COMMAND: ssh -p $NGROK_PORT $(whoami)@$NGROK_HOST"
          echo "############################################"
          sleep 5400

      - name: Build for simulator (no code signing, just validating the pipeline)
        run: |
          set -o pipefail
          # MARK: ViboGram - re-print toolchain diagnostics right before the build
          # that actually hits the SwiftSignalKitFramework race, to catch any drift
          # since the "Select Xcode" step (e.g. a later step resetting SDKROOT/
          # TOOLCHAINS, or a different swiftc being picked up transitively).
          echo "=== Toolchain diagnostics (pre-build) ===" | tee -a build.log
          xcode-select -p | tee -a build.log
          xcodebuild -version | tee -a build.log
          xcrun --find swift | tee -a build.log
          xcrun swift --version | tee -a build.log
          # rules_xcodeproj's "Copy Bazel Outputs" script phases intermittently
          # race the underlying bazel build for the first few framework
          # targets ("No such file or directory" copying a .swiftmodule that
          # hasn't landed yet). Ruled out so far: COMPILER_INDEX_STORE_ENABLE,
          # Bazel disk caching, reusing the same DerivedData across retries
          # (worse -- leaves locked files), and Xcode target-build parallelism
          # (forcing parallelizeBuildables=NO still hit the identical race on
          # a real run, just ~2x slower). Each retry attempt below at least
          # gets a fresh DerivedData, which is a genuine partial redo, but not
          # a full one -- Bazel's own execroot/disk-cache state is still
          # shared across attempts, and (confirmed the hard way) blindly
          # nuking rules_xcodeproj's separate internal bazel output_base to
          # "fix" that breaks the retry worse (deletes generated scaffolding
          # it depends on, not just stale outputs). Root cause is still
          # unresolved -- this loop is a mitigation, not a fix. See
          # docs/plugin-system-tier4.md-adjacent history / commit log for the
          # full list of tried-and-reverted theories before adding a new one.
          for attempt in 1 2; do
            echo "=== xcodebuild attempt $attempt/2 (fresh DerivedData) ===" | tee -a build.log
            if xcodebuild build \
              -project "${{ steps.proj.outputs.path }}" \
              -scheme "${{ steps.scheme.outputs.name }}" \
              -sdk iphonesimulator \
              -destination "generic/platform=iOS Simulator" \
              -configuration Debug \
              -derivedDataPath "$HOME/derived-sim-$attempt" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              | tee -a build.log; then
              ln -s "$HOME/derived-sim-$attempt" "$HOME/derived-sim"
              break
            fi
            # GH Actions runs steps under `bash -e`. A killed xcodebuild can leave files
            # locked, so `rm -rf` here may exit non-zero (Permission denied / Directory
            # not empty) on a partial cleanup -- `|| true` so that alone doesn't abort
            # the whole script before the loop gets to retry.
            rm -rf "$HOME/derived-sim-$attempt" || true
            # MARK: ViboGram - TRIED AND REVERTED: also clearing rules_xcodeproj's own
            # separate bazel output_base (/var/tmp/_bazel_*/*/rules_xcodeproj.noindex/)
            # here on the theory that it persisted stale state across attempts. It does
            # persist, but this directory also holds the *generated external repo*
            # rules_xcodeproj's own "Generate Bazel Dependencies" script phase depends
            # on (rules_xcodeproj_generated//generator/Telegram/Telegram_xcodeproj),
            # which is NOT regenerated by a bare xcodebuild retry -- confirmed via a
            # real run: attempt 2 failed near-instantly with "no such package
            # ...Telegram_xcodeproj: BUILD file not found", a different and strictly
            # worse failure than the SwiftSignalKitFramework race it was meant to fix.
            # Do not re-add this without a way to distinguish stale build outputs from
            # essential generated scaffolding within that directory.
            if [ "$attempt" = 2 ]; then
              echo "Both attempts failed" >&2
              exit 1
            fi
            echo "Attempt $attempt failed, retrying with a fresh DerivedData..." | tee -a build.log
          done

      - name: Disk usage after build
        if: always()
        run: df -h /

      - name: Boot simulator, install, launch, and screenshot (smoke test)
        id: smoke
        continue-on-error: true
        run: |
          set -euo pipefail
          APP_PATH=$(find -L "$HOME/derived-sim" -iname "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found for smoke test" >&2
            exit 1
          fi
          echo "App: $APP_PATH"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          echo "Bundle id: $BUNDLE_ID"

          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for runtime, devices in d['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for dev in devices:
                  if 'iPhone' in dev['name']:
                      print(dev['udid'])
                      sys.exit(0)
          sys.exit(1)
          ")
          echo "Using simulator: $DEVICE_ID"

          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          sleep 8
          xcrun simctl io "$DEVICE_ID" screenshot smoke-test-screenshot.png
          echo "Screenshot taken. Note: without a real logged-in account this only shows the initial launch screen, not app UI behind login."

      - name: Upload smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshot
          path: smoke-test-screenshot.png
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trial-build-log
          path: |
            build.log
            scheme_list.txt

      - name: Build for device (signed)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "${{ steps.proj.outputs.path }}" \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath "$HOME/derived-device" \
            -destination "generic/platform=iOS" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tee build-device.log

      - name: Package signed IPA
        id: ipa
        continue-on-error: true
        run: |
          set -uo pipefail
          # rules_xcodeproj embeds a *symlinked* bazel-out inside DerivedData
          # (Build/Products/.../bazel-out -> real Bazel output tree). Plain `find`
          # doesn't descend into symlinked directories at all -- needs `-L`.
          APP_PATH=$(find -L "$HOME/derived-device" -iname "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Not found under DerivedData, searching repo-root bazel-out..."
            APP_PATH=$(find -L bazel-out -iname "*.app" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "No .app found anywhere. Diagnostic listing:" >&2
            find -L "$HOME/derived-device/Build/Products" -maxdepth 8 >&2 || true
            exit 1
          fi
          echo "Found app: $APP_PATH"
          set -e
          SHORT_SHA=$(git rev-parse --short HEAD)
          IPA_NAME="ViboGram-${SHORT_SHA}.ipa"
          PACK_DIR=$(mktemp -d)/Payload
          mkdir -p "$PACK_DIR"
          cp -R "$APP_PATH" "$PACK_DIR/"
          (cd "$(dirname "$PACK_DIR")" && zip -r -y -q "$GITHUB_WORKSPACE/$IPA_NAME" Payload)
          echo "path=$IPA_NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$IPA_NAME"

      - name: Upload device build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trial-build-device-log
          path: build-device.log

      - name: Publish signed IPA as a versioned pre-release
        id: release
        if: steps.ipa.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A.B.C versioning: A = 0 (pre-release) until the last tier lands, then
          # flips to 1 for good. B = number of completed roadmap tiers (bump by
          # hand as tiers finish). C = release counter *within* the current A.B
          # (resets when B -- or the A flip -- changes, not a global counter).
          # Tier 3 is in progress, not finished -- TIERS_DONE here doubles as
          # "how many Tier 3 items have shipped a release" per C, not "tiers
          # fully complete" like it did for Tiers 1/2. Bump the roadmap wording
          # below once Tier 3 (all 6 items + badges) is actually done.
          TIERS_DONE: "3"
        run: |
          set -euo pipefail
          if [ "$TIERS_DONE" = "4" ]; then
            MAJOR=1
          else
            MAJOR=0
          fi
          PREFIX="${MAJOR}.${TIERS_DONE}."
          # max(existing C), not count() -- manual test releases can leave gaps
          # or take a specific number, and count() would then collide with an
          # already-used tag instead of skipping past it.
          EXISTING_MAX=$(gh api "repos/${{ github.repository }}/releases" --jq \
            "[.[] | select(.tag_name | startswith(\"$PREFIX\")) | (.tag_name | split(\".\")[2] | tonumber? // -1)] | if length == 0 then -1 else max end")
          NEXT_C=$((EXISTING_MAX + 1))
          if [ "$MAJOR" = "0" ] && [ "$NEXT_C" = "0" ]; then
            NEXT_C=1
          fi
          VERSION="${MAJOR}.${TIERS_DONE}.${NEXT_C}"
          NOTES="Signed device IPA, auto-published from trial-build.yml ($(git rev-parse --short HEAD)). Signed with a free-tier Apple ID cert/profile — install directly via LiveContainer/AltStore/SideStore (no resigning needed), but the cert expires after 7 days and the profile is locked to registered device UDIDs. No push notifications (free Apple ID can't get that entitlement). Tiers 1-2 of the roadmap complete, Tier 3 in progress."
          gh release create "$VERSION" "${{ steps.ipa.outputs.path }}" \
            --title "$VERSION" \
            --notes "$NOTES" \
            --generate-notes \
            --prerelease
          # --generate-notes appends a "What's Changed" changelog server-side, so
          # re-read the release to get the real final body for the Telegram post
          # (the local $NOTES var only has the static header we passed in).
          FINAL_NOTES=$(gh release view "$VERSION" --json body --jq '.body')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<NOTESEOF"
            echo "$FINAL_NOTES"
            echo "NOTESEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Announce release in Telegram
        if: steps.release.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ steps.release.outputs.version }}
          NOTES: ${{ steps.release.outputs.notes }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          export IPA_URL=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name | endswith(".ipa")) | .url')
          export TG_BASE_VERSION=$(python3 -c "import json; print(json.load(open('versions.json'))['app'])")

          python3 build-system/telegram_announce.py
