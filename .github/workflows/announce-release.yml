name: announce-release

on:
  release:
    types: [published]

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Announce release in Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          REPO_URL: ${{ github.event.repository.html_url }}
          ASSETS_JSON: ${{ toJson(github.event.release.assets) }}
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import html, json, os, re, urllib.request

          def gh_notes_to_html(md: str) -> str:
              # Release bodies (hand-written or GitHub's "Generate release notes")
              # are Markdown -- escape first so Telegram's HTML parser doesn't choke
              # on stray </> or &, then convert the common patterns into real tags.
              text = html.escape(md)
              text = re.sub(r'(?m)^#{1,6}\s*(.+)$', r'<b>\1</b>', text)
              text = re.sub(r'\*\*(.+?)\*\*', r'<b>\1</b>', text)
              text = re.sub(r'(?m)^[\*\-]\s+', '• ', text)
              return text

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          version = os.environ["VERSION"]
          raw_notes = os.environ.get("NOTES") or "(без описания)"
          release_url = os.environ["RELEASE_URL"]
          repo_url = os.environ["REPO_URL"]
          assets = json.loads(os.environ["ASSETS_JSON"])

          ipa_url = None
          for asset in assets:
              if asset["name"].endswith(".ipa"):
                  ipa_url = asset["browser_download_url"]
                  break

          footer = "⚠️ Устанавливается через LiveContainer/AltStore/SideStore."
          header = f"🚀 <b>ViboGram {version}</b>\n\n"
          budget = 4096 - len(header) - len(footer) - 4
          if len(raw_notes) > budget:
              raw_notes = raw_notes[:budget - 1] + "…"
          notes = gh_notes_to_html(raw_notes)
          text = f"{header}{notes}\n\n{footer}"

          top_row = [{"text": "📦 Релиз на GitHub", "url": release_url}]
          if ipa_url:
              top_row.insert(0, {"text": "⬇️ Скачать IPA", "url": ipa_url})
          buttons = [top_row, [{"text": "⭐ Репозиторий", "url": repo_url}]]

          payload = json.dumps({
              "chat_id": chat_id,
              "text": text,
              "parse_mode": "HTML",
              "reply_markup": {"inline_keyboard": buttons},
          }).encode()

          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req) as resp:
              print(resp.read().decode())
          EOF
