name: announce-release

on:
  release:
    types: [published]

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for build-system/telegram_announce.py + versions.json)
        uses: actions/checkout@v4

      - name: Announce release in Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ASSETS_JSON: ${{ toJson(github.event.release.assets) }}
        run: |
          set -euo pipefail
          export TG_BASE_VERSION=$(python3 -c "import json; print(json.load(open('versions.json'))['app'])")
          export IPA_URL=$(python3 -c "
          import json, os
          assets = json.loads(os.environ['ASSETS_JSON'])
          for asset in assets:
              if asset['name'].endswith('.ipa'):
                  print(asset['browser_download_url'])
                  break
          ")
          python3 build-system/telegram_announce.py
